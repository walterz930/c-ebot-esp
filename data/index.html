<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C-EBOT ESP32</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><h1>C-EBOT</h1><p>ESP32 standalone dashboard</p></div><span id="badge" class="badge">Connecting</span></header><section class="grid"><article><small>Chaster</small><strong id="chaster">—</strong></article><article><small>EmlaLock</small><strong id="emla">—</strong></article></section><section class="panel"><div class="row"><b>Status</b><span id="state">—</span></div><p id="message">Loading…</p><p class="muted" id="network"></p></section><section class="actions"><button onclick="post('/api/sync')">Sync now</button><button class="secondary" onclick="post('/api/pause')">Pause</button><button class="secondary" onclick="post('/api/resume')">Resume</button></section><section class="panel"><h2>Configuration</h2><label>Chaster lock ID<input id="lock"></label><label>Chaster token<input id="ct" type="password" placeholder="Leave blank to keep saved token"></label><label>EmlaLock user ID<input id="uid"></label><label>EmlaLock API key<input id="eak" type="password" placeholder="Leave blank to keep saved key"></label><label>Sync interval (seconds)<input id="interval" type="number" min="10" value="30"></label><button onclick="saveConfig()">Save configuration</button><p class="muted">Live synchronization remains disabled until the API clients are validated for your accounts and device.</p></section></main><script src="/app.js"></script></body></html>
